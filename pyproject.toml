[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquanav-rl"
version = "0.1.0"
description = "A lightweight benchmark for AUV navigation under uncertain ocean currents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
]
dev = ["pytest>=8.0"]

[project.scripts]
aquanav-demo = "aquanav.main:main"
aquanav-train = "aquanav.train_ppo:main"

[tool.setuptools.packages.find]
include = ["aquanav*"]

